<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Sunbaby Special Food Menu</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #111;
    color: #fff;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    touch-action: pan-x pan-y;
  }

  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
    pointer-events: none;
  }
  .header > * { pointer-events: auto; }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .page-indicator {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.5);
    padding: 4px 12px;
    border-radius: 12px;
  }

  .carousel {
    display: flex;
    height: 100dvh;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .slide {
    flex: 0 0 100%;
    height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .slide a {
    display: flex;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .hiddenslide {
    flex: 0 0 100%;
    height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    pointer-events: none;
  }
  .hiddenslide a {
    display: flex;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  .hiddenslide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 90;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    backdrop-filter: blur(4px);
  }
  .nav-btn:hover { background: rgba(0,0,0,0.7); }
  .nav-btn:active { background: rgba(0,0,0,0.9); }
  .nav-prev { left: 8px; }
  .nav-next { right: 8px; }
  .nav-btn.hidden { display: none; }

  @media (max-width: 768px) {
    .header h1 { font-size: 14px; }
    .nav-btn { width: 36px; height: 36px; font-size: 18px; }
    .nav-prev { left: 4px; }
    .nav-next { right: 4px; }
  }

  .loading {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    transition: opacity 0.5s;
  }
  .loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading p {
    margin-top: 16px;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>Loading menu...</p>
</div>

<div class="header">
  <h1>Sunbaby Special</h1>
  <span class="page-indicator" id="pageIndicator">1 / 8</span>
</div>

<button class="nav-btn nav-prev hidden" id="prevBtn" aria-label="Previous page">‹</button>
<button class="nav-btn nav-next" id="nextBtn" aria-label="Next page">›</button>

<div class="carousel" id="carousel">
  <div class="hiddenslide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_08.jpg" alt="Menu page 8" loading="lazy"></a></div>
  <div class="slide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_01.jpg" alt="Menu page 1" loading="lazy"></a></div>
  <div class="slide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_02.jpg" alt="Menu page 2" loading="lazy"></a></div>
  <div class="slide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_03.jpg" alt="Menu page 3" loading="lazy"></a></div>
  <div class="slide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_04.jpg" alt="Menu page 4" loading="lazy"></a></div>
  <div class="slide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_05.jpg" alt="Menu page 5" loading="lazy"></a></div>
  <div class="slide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_06.jpg" alt="Menu page 6" loading="lazy"></a></div>
  <div class="slide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_07.jpg" alt="Menu page 7" loading="lazy"></a></div>
  <div class="slide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_08.jpg" alt="Menu page 8" loading="lazy"></a></div>
  <div class="hiddenslide"><a href="https://sunbaby-special-pckm.vercel.app/" target="_blank" rel="noopener noreferrer"><img src="images/page_01.jpg" alt="Menu page 1" loading="lazy"></a></div>
</div>

<script>
  const carousel = document.getElementById('carousel');
  const allSlides = carousel.querySelectorAll('.slide, .hiddenslide');
  const realSlides = document.querySelectorAll('.slide');
  const totalReal = realSlides.length;
  const pageIndicator = document.getElementById('pageIndicator');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const loading = document.getElementById('loading');

  const LINK_URL = 'https://sunbaby-special-pckm.vercel.app/';

  let currentIndex = 0;
  let isJumping = false;

  function updateUI() {
    pageIndicator.textContent = `${currentIndex + 1} / ${totalReal}`;
  }

  function getRealIndex(closestIndex) {
    return (closestIndex - 1 + totalReal) % totalReal;
  }

  function goToSlide(index, instant = false) {
    const target = index + 1;
    if (target < 0 || target >= allSlides.length) return;
    currentIndex = (index + totalReal) % totalReal;
    const slide = allSlides[target];
    slide.scrollIntoView({ behavior: instant ? 'instant' : 'smooth', block: 'nearest', inline: 'start' });
    updateUI();
  }

  function jumpToClamped() {
    const scrollLeft = carousel.scrollLeft;
    const slideWidth = carousel.clientWidth;
    const closest = Math.round(scrollLeft / slideWidth);

    if (closest === 0) {
      isJumping = true;
      currentIndex = totalReal - 1;
      carousel.scrollTo({ left: totalReal * slideWidth, behavior: 'instant' });
      updateUI();
      requestAnimationFrame(() => { isJumping = false; });
    } else if (closest === allSlides.length - 1) {
      isJumping = true;
      currentIndex = 0;
      carousel.scrollTo({ left: 1 * slideWidth, behavior: 'instant' });
      updateUI();
      requestAnimationFrame(() => { isJumping = false; });
    } else {
      const real = getRealIndex(closest);
      if (real !== currentIndex) {
        currentIndex = real;
        updateUI();
      }
    }
  }

  prevBtn.addEventListener('click', () => {
    goToSlide(currentIndex - 1);
  });

  nextBtn.addEventListener('click', () => {
    goToSlide(currentIndex + 1);
  });

  carousel.addEventListener('scroll', () => {
    if (!isJumping) {
      jumpToClamped();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goToSlide(currentIndex - 1);
    if (e.key === 'ArrowRight') goToSlide(currentIndex + 1);
  });

  window.addEventListener('load', () => {
    setTimeout(() => loading.classList.add('hidden'), 300);
  });

  carousel.scrollTo({ left: 1 * carousel.clientWidth, behavior: 'instant' });
  currentIndex = 0;
  updateUI();

  allSlides.forEach(slide => {
    const a = slide.querySelector('a');
    if (a) a.addEventListener('click', (e) => {
      e.preventDefault();
      window.open(LINK_URL, '_blank');
    });
  });
</script>
</body>
</html>
