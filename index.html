<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Sunbaby Special Food Menu</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #111;
    color: #fff;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
  }

  .ptr {
    position: fixed;
    top: -60px;
    left: 0;
    right: 0;
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 60px;
    background: rgba(17,17,17,0.95);
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    font-weight: 500;
    transition: transform 0.2s;
  }
  .ptr.visible { transform: translateY(60px); }
  .ptr .ptr-arrow {
    display: inline-block;
    font-size: 18px;
    transition: transform 0.2s;
  }
  .ptr.ready .ptr-arrow { transform: rotate(180deg); }

  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
    pointer-events: none;
  }
  .header > * { pointer-events: auto; }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .page-indicator {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.5);
    padding: 4px 12px;
    border-radius: 12px;
  }

  .carousel {
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    position: relative;
    touch-action: none;
  }

  .carousel-track {
    display: flex;
    height: 100%;
    will-change: transform;
    transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .carousel-track.no-transition {
    transition: none;
  }

  .slide {
    flex: 0 0 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    padding: 12px 16px;
    background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    pointer-events: none;
  }
  .bottom-bar .site-link {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.1);
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-bar .site-link:hover { background: rgba(255,255,255,0.25); }
  .bottom-bar .site-link:active { background: rgba(255,255,255,0.35); }
  .bottom-bar .site-link svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 90;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    backdrop-filter: blur(4px);
  }
  .nav-btn:hover { background: rgba(0,0,0,0.7); }
  .nav-btn:active { background: rgba(0,0,0,0.9); }
  .nav-prev { left: 8px; }
  .nav-next { right: 8px; }
  .nav-btn.hidden { display: none; }

  @media (max-width: 768px) {
    .header h1 { font-size: 14px; }
    .nav-btn { width: 36px; height: 36px; font-size: 18px; }
    .nav-prev { left: 4px; }
    .nav-next { right: 4px; }
  }

  .loading {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    transition: opacity 0.5s;
  }
  .loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading p {
    margin-top: 16px;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
  (function() {
    const track = document.getElementById('track');
    const carousel = document.getElementById('carousel');
    const pageIndicator = document.getElementById('pageIndicator');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const loading = document.getElementById('loading');

    const TOTAL = 8;
    const slides = track.children;
    const totalSlides = slides.length;

    let current = 1;

    function update() {
      const realIndex = ((current - 1) % TOTAL + TOTAL) % TOTAL;
      pageIndicator.textContent = (realIndex + 1) + ' / ' + TOTAL;
    }

    function go(index, instant) {
      current = index;
      const offset = -current * 100;
      if (instant) {
        track.classList.add('no-transition');
        track.style.transform = 'translateX(' + offset + '%)';
        track.offsetHeight;
        track.classList.remove('no-transition');
      } else {
        track.style.transform = 'translateX(' + offset + '%)';
      }
      update();
    }

    function slideTo(index) {
      if (index < 0 || index >= totalSlides) return;
      go(index, false);
    }

    function clamp() {
      if (current === 0) go(TOTAL, true);
      else if (current === totalSlides - 1) go(1, true);
    }

    var touchStartX = 0;
    var touchStartY = 0;
    var ptr = document.getElementById('ptr');
    var ptrArrow = document.getElementById('ptrArrow');
    var ptrText = document.getElementById('ptrText');

    carousel.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      ptr.classList.remove('visible', 'ready');
    }, { passive: true });

    carousel.addEventListener('touchmove', function(e) {
      var dy = e.changedTouches[0].screenY - touchStartY;
      if (dy > 20) {
        ptr.classList.add('visible');
        if (dy > 80) ptr.classList.add('ready');
        else ptr.classList.remove('ready');
      } else {
        ptr.classList.remove('visible', 'ready');
      }
    }, { passive: true });

    carousel.addEventListener('touchend', function(e) {
      var dx = e.changedTouches[0].screenX - touchStartX;
      var dy = e.changedTouches[0].screenY - touchStartY;
      var adx = dx < 0 ? -dx : dx;
      var ady = dy < 0 ? -dy : dy;
      if (ady > adx && dy > 80) {
        ptrText.textContent = 'Refreshing...';
        setTimeout(function() { location.reload(); }, 100);
        return;
      }
      ptr.classList.remove('visible', 'ready');
      if (adx > ady) {
        if (dx < -40) slideTo(current + 1);
        else if (dx > 40) slideTo(current - 1);
      }
    }, { passive: true });

    track.addEventListener('transitionend', clamp);

    prevBtn.addEventListener('click', function() {
      slideTo(current - 1);
    });

    nextBtn.addEventListener('click', function() {
      slideTo(current + 1);
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') slideTo(current - 1);
      if (e.key === 'ArrowRight') slideTo(current + 1);
    });

    window.addEventListener('load', function() {
      setTimeout(function() { loading.classList.add('hidden'); }, 300);
    });

    go(1, true);
  })();
</script>
